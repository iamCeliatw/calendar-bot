name: Calendar LINE Notification

# 每日排程已搬到 Cloud Scheduler（呼叫 Cloud Run 的 /tasks/daily-notify）；
# GitHub cron 實測每天晚 2～4 小時。這裡只留手動觸發當備援，確認 Scheduler 穩定後整個刪掉。
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google token
        env:
          GOOGLE_TOKEN_JSON_B64: ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
        run: python write_token.py

      - name: Send notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}
          TIMEZONE: Asia/Taipei
          ENABLE_TOMORROW_PREVIEW: 'true'
          ALLOW_BROWSER_OAUTH: 'false'
        run: python main.py test
