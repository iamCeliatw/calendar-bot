name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 讓 job 能向 GitHub 要 OIDC token，換 GCP 短期憑證（Workload Identity Federation）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/196656814832/locations/global/workloadIdentityPools/github/providers/calendar-bot
          service_account: github-deployer@daring-feat-489102-s4.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=asia-east1-docker.pkg.dev/daring-feat-489102-s4/cloud-run-source-deploy/calendar-bot-webhook:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy calendar-bot-webhook \
            --image $IMAGE \
            --region asia-east1 \
            --project daring-feat-489102-s4 \
            --quiet
