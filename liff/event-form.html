<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程表單</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #333; }

    .header {
      background: #4A90E2; color: #fff;
      padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    }
    .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    .header h1 { font-size: 16px; font-weight: 600; }

    .form-body { padding: 16px; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; }
    input[type="text"], input[type="date"] {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; background: #fff; color: #333;
      -webkit-appearance: none; appearance: none;
    }
    input:focus { outline: none; border-color: #4A90E2; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px;
    }
    .toggle-label { font-size: 14px; }
    .toggle {
      width: 42px; height: 24px; background: #ccc; border-radius: 12px;
      position: relative; cursor: pointer; transition: background 0.2s; border: none;
    }
    .toggle.on { background: #4A90E2; }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 20px; height: 20px; background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }

    .time-field { display: flex; align-items: center; gap: 4px; }
    .time-field select {
      flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; background: #fff; color: #333;
    }
    .time-field select:focus { outline: none; border-color: #4A90E2; }
    .time-colon { font-weight: 600; color: #666; }
    .time-row { display: flex; gap: 10px; }
    .time-row .field { flex: 1; }

    .err { color: #e74c3c; font-size: 12px; margin-top: 4px; display: none; }
    .err.show { display: block; }

    .submit-btn {
      width: 100%; padding: 14px; background: #4A90E2; color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }
    .submit-btn:active { opacity: 0.85; }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }

    .loading-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,0.8); align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; z-index: 999;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid #e0e0e0;
      border-top-color: #4A90E2; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="liff.closeWindow()">✕</button>
  <h1 id="formTitle">新增行程</h1>
</div>

<div class="form-body">
  <div class="field">
    <label>行程名稱 *</label>
    <input type="text" id="summary" placeholder="請輸入行程名稱">
    <div class="err" id="errSummary">請輸入行程名稱</div>
  </div>

  <div class="field">
    <label>日期 *</label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <div class="toggle-row">
      <span class="toggle-label">全天事件</span>
      <button class="toggle" id="allDayToggle" aria-pressed="false"></button>
    </div>
  </div>

  <div class="field" id="endDateField" style="display:none">
    <label>結束日期</label>
    <input type="date" id="endDate">
    <div class="err" id="errEndDate">結束日期不可早於開始日期</div>
  </div>

  <div id="timeFields">
    <div class="time-row">
      <div class="field">
        <label>開始時間</label>
        <span id="startTimeBox"></span>
      </div>
      <div class="field">
        <label>結束時間</label>
        <span id="endTimeBox"></span>
      </div>
    </div>
    <div class="err" id="errTime">結束時間須晚於開始時間</div>
  </div>

  <div class="field">
    <label>地點（選填）</label>
    <input type="text" id="location" placeholder="請輸入地點">
  </div>

  <button class="submit-btn" id="submitBtn">建立行程</button>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:14px;color:#666">處理中…</div>
</div>

<script>
const API_BASE = '';
let accessToken = '';
let eventId = null;
let isAllDay = false;

async function init() {
  try {
    await liff.init({ liffId: '{{LIFF_FORM_ID}}' });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    accessToken = liff.getAccessToken();

    const params = new URLSearchParams(location.search);
    eventId = params.get('event_id');

    document.getElementById('startTimeBox').innerHTML = timeFieldHTML('startTime');
    document.getElementById('endTimeBox').innerHTML   = timeFieldHTML('endTime');
    setTime('startTime', '09:00');
    setTime('endTime', '10:00');
    document.getElementById('startTimeH').addEventListener('change', syncEndTime);
    document.getElementById('startTimeM').addEventListener('change', syncEndTime);

    const dateParam = params.get('date');
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('date').value =
      /^\d{4}-\d{2}-\d{2}$/.test(dateParam || '') ? dateParam : today;
    syncEndDate();

    if (eventId) {
      document.getElementById('formTitle').textContent = '編輯行程';
      document.getElementById('submitBtn').textContent = '更新行程';
      await loadEvent(eventId);
    }
  } catch (e) {
    alert('初始化失敗：' + e.message);
  }
}

async function loadEvent(id) {
  try {
    const res = await fetch(`${API_BASE}/api/events/${id}`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if (res.status === 404) {
      alert('找不到此行程，將切換為新增模式');
      eventId = null;
      document.getElementById('formTitle').textContent = '新增行程';
      document.getElementById('submitBtn').textContent = '建立行程';
      return;
    }
    const ev = await res.json();
    if (ev.is_editable === false) {
      alert('此行程由 Gmail 自動建立（例如訂位、航班通知），無法在此編輯，請至 Google 日曆查看');
      liff.closeWindow();
      return;
    }
    document.getElementById('summary').value = ev.summary || '';
    document.getElementById('location').value = ev.location || '';

    if (ev.is_all_day) {
      document.getElementById('date').value = ev.date || ev.start?.slice(0,10) || '';
      document.getElementById('endDate').value = ev.end_date || ev.date || '';
      setAllDay(true);
    } else {
      document.getElementById('date').value = ev.start?.slice(0,10) || '';
      syncEndDate();
      setTime('startTime', ev.start?.slice(11,16) || '09:00');
      setTime('endTime', ev.end?.slice(11,16) || '10:00');
    }
  } catch (e) {
    alert('載入行程失敗：' + e.message);
  }
}

// ponytail: 用 <select> 取代 <input type="time">。原生 time picker 的 12/24 小時制由
// OS / 瀏覽器 locale 決定（Android 跟系統設定、iOS 跟 iOS 設定），lang 屬性壓不住，
// 只有自己畫才能保證兩個平台都是 24 小時制。
const _TIME_OPTS = n => Array.from({length: n},
  (_, i) => `<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')}</option>`).join('');
const _HOUR_OPTS = _TIME_OPTS(24), _MIN_OPTS = _TIME_OPTS(60);
function timeFieldHTML(id) {
  return `<span class="time-field"><select id="${id}H">${_HOUR_OPTS}</select>`
       + `<span class="time-colon">:</span><select id="${id}M">${_MIN_OPTS}</select></span>`;
}
function getTime(id) {
  return `${document.getElementById(id + 'H').value}:${document.getElementById(id + 'M').value}`;
}
function setTime(id, val) {
  const [h, m] = (val || '09:00').split(':');
  document.getElementById(id + 'H').value = h;
  document.getElementById(id + 'M').value = m;
}

function setAllDay(val) {
  isAllDay = val;
  const btn = document.getElementById('allDayToggle');
  btn.classList.toggle('on', val);
  btn.setAttribute('aria-pressed', val);
  document.getElementById('timeFields').style.display = val ? 'none' : 'block';
  document.getElementById('endDateField').style.display = val ? 'block' : 'none';
}

document.getElementById('allDayToggle').onclick = () => setAllDay(!isAllDay);

// 開始日期往後調超過結束日期時，結束日期跟著推
function syncEndDate() {
  const start = document.getElementById('date').value;
  const end = document.getElementById('endDate');
  if (!end.value || end.value < start) end.value = start;
}
document.getElementById('date').addEventListener('change', syncEndDate);

function syncEndTime() {
  const [h, m] = getTime('startTime').split(':').map(Number);
  setTime('endTime', `${String((h + 1) % 24).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
}

function validate() {
  let ok = true;
  const summary = document.getElementById('summary').value.trim();
  if (!summary) {
    document.getElementById('errSummary').classList.add('show');
    ok = false;
  } else {
    document.getElementById('errSummary').classList.remove('show');
  }
  if (isAllDay) {
    const bad = document.getElementById('endDate').value < document.getElementById('date').value;
    document.getElementById('errEndDate').classList.toggle('show', bad);
    if (bad) ok = false;
  } else {
    const s = getTime('startTime');
    const e = getTime('endTime');
    if (s >= e) {
      document.getElementById('errTime').classList.add('show');
      ok = false;
    } else {
      document.getElementById('errTime').classList.remove('show');
    }
  }
  return ok;
}

document.getElementById('submitBtn').onclick = async () => {
  if (!validate()) return;

  const date = document.getElementById('date').value;
  const body = {
    summary: document.getElementById('summary').value.trim(),
    date,
    is_all_day: isAllDay,
    location: document.getElementById('location').value.trim(),
  };
  if (isAllDay) {
    body.end_date = document.getElementById('endDate').value || date;
  } else {
    body.start_time = getTime('startTime');
    body.end_time   = getTime('endTime');
  }

  document.getElementById('loadingOverlay').classList.add('show');
  document.getElementById('submitBtn').disabled = true;

  try {
    const url    = eventId ? `${API_BASE}/api/events/${eventId}` : `${API_BASE}/api/events`;
    const method = eventId ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());

    liff.closeWindow();
  } catch (e) {
    document.getElementById('loadingOverlay').classList.remove('show');
    document.getElementById('submitBtn').disabled = false;
    alert('操作失敗：' + e.message);
  }
};

init();
</script>
</body>
</html>
